# iOS uygulamasinin derlenmesi ve testleri.
#
# Proje dosyasi DEPODA DURMAZ; `project.yml` tanimindan uretilir (bkz.
# apps/ios/project.yml). Bu is akisi, tanimin gercekten derlenebilir bir proje
# urettigini her degisiklikte dogrular - aksi halde "bende calisiyordu" ile
# "CI'da yok" arasindaki fark, ilk surumden bir gun once anlasilir.

name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build-test:
    # Xcode yalnizca macOS'ta calisir; baska bir kosucu secenegi yoktur.
    #
    # Kosucu imaji XCODEGEN'IN URETTIGI PROJE BICIMINI OKUYABILECEK kadar yeni
    # olmalidir. `brew install xcodegen` her zaman en guncel surumu kurar ve
    # uretilen bicim geriye uyumlu degildir; macos-14 (Xcode 15) bu yuzden
    # "future Xcode project file format" hatasi verdi. Imaj etiketi acikca
    # yazilir - `macos-latest` sessizce kayar ve kayma bir gun projeyi
    # okunamaz hale getirir.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Araçları kur
        # xcbeautify kosucu imajinda bulunabilir; acikca kurmak, imaj
        # degistiginde is akisinin sessizce kirilmasini onler.
        run: brew install xcodegen xcbeautify

      - name: Projeyi üret
        working-directory: apps/ios
        run: xcodegen generate

      # Cihaz adi ELLE YAZILMAZ. "iPhone 15" gibi sabit bir ad, kosucu imaji
      # yenilendiginde o simulator kaldirildigi icin is akisini kirar - ve
      # hata, kodla hicbir ilgisi olmayan bir yerden gelir. Mevcut olanlardan
      # en yenisi secilir.
      # Betik TEK SATIRDIR. YAML blok metninde, blok girintisinden daha az
      # girintili bir satir blogu SONLANDIRIR; Python'un sutun 0'dan baslayan
      # govdesi bu yuzden is akisi dosyasini gecersiz kilar (ve hata, adim
      # calismadan once "workflow file issue" olarak doner). Python'a uniform
      # girinti de verilemez - ust seviye kodda girinti hatadir.
      - name: Simülatör seç
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x.get('isAvailable') and 'iPhone' in x['name']]; sys.exit('Kullanilabilir iPhone simulatoru yok.') if not c else print(c[-1]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Derle ve test et
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project ToptanPortal.xcodeproj \
            -scheme ToptanPortal \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Test sonuçlarını yükle
        # Basarisiz kosuda da yuklenir: sonuclara EN COK o zaman ihtiyac vardir.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: apps/ios/TestResults.xcresult
          retention-days: 7
